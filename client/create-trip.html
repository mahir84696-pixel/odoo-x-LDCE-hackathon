<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create trip · GlobeTrotter</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/trip.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main class="page-content">
    <div class="container" style="max-width:680px">
      <div class="card">
        <h2>Plan a new trip</h2>
        <p class="kpi-label" style="margin-bottom:1.2rem">Choose your route and the planner will create a day-by-day itinerary automatically.</p>
        <form id="tripForm">
          <div class="form-group"><label class="form-label">Trip name</label><input class="form-input" id="tripName" required></div>
          <div class="grid grid-2">
            <div class="form-group"><label class="form-label">Start</label><input class="form-input" id="startDate" type="date" required></div>
            <div class="form-group"><label class="form-label">End</label><input class="form-input" id="endDate" type="date" required></div>
          </div>
          <div class="grid grid-2">
            <div class="form-group"><label class="form-label">Start city</label><select class="form-input" id="originCity" required></select></div>
            <div class="form-group"><label class="form-label">Destination city</label><select class="form-input" id="destinationCity" required></select></div>
          </div>
          <div class="form-group"><label class="form-label">Total budget (INR)</label><input class="form-input" id="budget" type="number" min="0" required></div>
          <div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="description" rows="3"></textarea></div>
          <button class="btn btn-primary">Create automatic itinerary</button>
          <a class="btn btn-ghost" href="dashboard.html">Cancel</a>
        </form>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/createTrip.js"></script>
</body>
</html>
